spring.application.name=COMPLAINT-SERVICE
server.port=8084

jwt.secret=${CIVICOPS_JWT_SECRET}
# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/civicops_complaints?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=civicops_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always